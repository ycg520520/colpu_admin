<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koa SSE JSON 数据传输</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .content {
      padding: 30px;
    }

    .upload-area {
      border: 3px dashed #ccc;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      margin: 20px 0;
      transition: border-color 0.3s;
      background: #fafafa;
    }

    .upload-area:hover {
      border-color: #667eea;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #e8f4ff;
    }

    .file-input {
      display: none;
    }

    .upload-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
      transition: background 0.3s;
    }

    .upload-btn:hover {
      background: #5a6fd8;
    }

    .upload-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .progress-container {
      margin: 20px 0;
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #45a049);
      width: 0%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }

    .progress-info {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .file-list {
      margin: 20px 0;
    }

    .file-item {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 10px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-info {
      flex: 1;
    }

    .file-name {
      font-weight: bold;
      color: #333;
    }

    .file-size {
      font-size: 12px;
      color: #666;
    }

    .file-status {
      font-size: 12px;
      color: #28a745;
      font-weight: bold;
    }

    .file-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .action-btn.delete {
      background: #dc3545;
    }

    .action-btn.download {
      background: #28a745;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      text-align: center;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .stats {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
    }

    .stats h4 {
      margin-bottom: 10px;
      color: #333;
    }

    .stats-item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .sse-status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    .sse-status.connecting {
      background: #fff3cd;
      color: #856404;
    }

    .sse-status.active {
      background: #d4edda;
      color: #155724;
    }

    .sse-status.closed {
      background: #f8d7da;
      color: #721c24;
    }

    .message-log {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 15px;
      margin: 10px 0;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }

    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-left: 3px solid #007bff;
      background: white;
    }

    .log-entry.init {
      border-left-color: #28a745;
    }

    .log-entry.progress {
      border-left-color: #ffc107;
    }

    .log-entry.complete {
      border-left-color: #28a745;
    }

    .log-entry.error {
      border-left-color: #dc3545;
    }

    .log-entry.end {
      border-left-color: #6f42c1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>📡 Koa SSE JSON 数据传输</h1>
      <p>通过 SSE 传输 JSON 格式的实时数据</p>
    </div>

    <div class="content">
      <div class="sse-status" id="sseStatus">
        SSE状态: 未连接
      </div>

      <button onclick="connectTestSSE()" class="upload-btn">连接测试 SSE</button>
      <button onclick="disconnectTestSSE()" class="upload-btn">断开测试 SSE</button>

      <div class="message-log" id="messageLog">
        <div class="log-entry">等待 SSE 消息...</div>
      </div>

      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" class="file-input" multiple>
        <p>📁 拖拽文件到此处或点击选择文件</p>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
          选择文件
        </button>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-info" id="progressInfo">准备上传...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill">0%</div>
        </div>
        <div id="detailedProgress"></div>
      </div>

      <div id="statusMessage"></div>

      <div class="file-list" id="fileList">
        <h3>已上传文件</h3>
        <div id="uploadedFilesList"></div>
      </div>

      <div class="stats">
        <h4>📊 上传统计</h4>
        <div class="stats-item">
          <span>总文件数:</span>
          <span id="totalFiles">0</span>
        </div>
        <div class="stats-item">
          <span>已完成:</span>
          <span id="completedFiles">0</span>
        </div>
        <div class="stats-item">
          <span>总大小:</span>
          <span id="totalSize">0</span>
        </div>
        <div class="stats-item">
          <span>当前进度:</span>
          <span id="currentProgress">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let uploadId = null;
    let uploadSSE = null;
    let testSSE = null;
    let uploadedFiles = [];

    // 测试 SSE 连接
    function connectTestSSE() {
      disconnectTestSSE(); // 先断开之前的连接

      testSSE = new EventSource('/api/test-sse');

      document.getElementById('sseStatus').className = 'sse-status active';
      document.getElementById('sseStatus').textContent = 'SSE状态: 测试连接中...';

      testSSE.onmessage = (event) => {
        console.log('Test SSE message:', event);
        addLogEntry('message', `收到消息: ${event.data}`, 'info');
      };

      testSSE.addEventListener('init', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('init', `初始化: ${JSON.stringify(data)}`, 'init');
      });

      testSSE.addEventListener('update', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('update', `更新: ${JSON.stringify(data)}`, 'progress');
      });

      testSSE.addEventListener('complete', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('complete', `完成: ${JSON.stringify(data)}`, 'complete');
      });

      testSSE.onerror = (error) => {
        document.getElementById('sseStatus').className = 'sse-status closed';
        document.getElementById('sseStatus').textContent = 'SSE状态: 测试连接错误';
        addLogEntry('error', `SSE错误: ${JSON.stringify(error)}`, 'error');
        console.error('Test SSE error:', error);
      };

      testSSE.onopen = () => {
        document.getElementById('sseStatus').className = 'sse-status active';
        document.getElementById('sseStatus').textContent = 'SSE状态: 测试已连接';
        addLogEntry('open', 'SSE连接已打开', 'info');
      };
    }

    function disconnectTestSSE() {
      if (testSSE) {
        testSSE.close();
        testSSE = null;
        document.getElementById('sseStatus').className = 'sse-status closed';
        document.getElementById('sseStatus').textContent = 'SSE状态: 测试已断开';
        addLogEntry('close', 'SSE连接已关闭', 'info');
      }
    }

    function addLogEntry(type, message, cssClass) {
      const logContainer = document.getElementById('messageLog');
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry ${cssClass}`;
      logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${type}: ${message}`;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // 拖拽上传
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      handleFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      if (files.length === 0) return;

      uploadId = Date.now().toString();

      const formData = new FormData();
      // 添加文件总数信息
      formData.append('totalFiles', files.length.toString());
      for (let i = 0; i < files.length; i++) {
        formData.append('files', files[i]);
      }

      startUpload(formData);
    }

    async function startUpload(formData) {
      // 显示进度条
      document.getElementById('progressContainer').style.display = 'block';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressFill').textContent = '0%';
      document.getElementById('progressInfo').textContent = '开始上传...';
      document.getElementById('detailedProgress').innerHTML = '';
      updateStats(0, 0, 0, '0%');

      // 连接上传 SSE
      uploadSSE = new EventSource(`/api/upload`, {
        withCredentials: true
      });

      document.getElementById('sseStatus').className = 'sse-status active';
      document.getElementById('sseStatus').textContent = 'SSE状态: 上传连接中...';

      // 监听所有事件类型
      uploadSSE.addEventListener('init', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('init', `上传初始化: ${JSON.stringify(data)}`, 'init');
        handleInit(data);
      });

      uploadSSE.addEventListener('progress', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('progress', `上传进度: ${JSON.stringify(data)}`, 'progress');
        handleProgressUpdate(data);
      });

      uploadSSE.addEventListener('status_update', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('status_update', `状态更新: ${JSON.stringify(data)}`, 'progress');
        handleStatusUpdate(data);
      });

      uploadSSE.addEventListener('complete', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('complete', `上传完成: ${JSON.stringify(data)}`, 'complete');
        handleComplete(data);
      });

      uploadSSE.addEventListener('error', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('error', `上传错误: ${JSON.stringify(data)}`, 'error');
        handleError(data);
      });

      uploadSSE.addEventListener('end', (event) => {
        const data = JSON.parse(event.data);
        addLogEntry('end', `连接结束: ${JSON.stringify(data)}`, 'end');
        handleEnd(data);
      });

      uploadSSE.onerror = (error) => {
        document.getElementById('sseStatus').className = 'sse-status closed';
        document.getElementById('sseStatus').textContent = 'SSE状态: 上传连接错误';
        addLogEntry('error', `SSE错误: ${JSON.stringify(error)}`, 'error');
        console.error('Upload SSE error:', error);
      };

      uploadSSE.onopen = () => {
        document.getElementById('sseStatus').className = 'sse-status active';
        document.getElementById('sseStatus').textContent = 'SSE状态: 上传已连接';
        addLogEntry('open', '上传SSE连接已打开', 'info');
      };

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Upload-Id': uploadId
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
      } catch (error) {
        showStatus(`上传错误: ${error.message}`, 'error');
        console.error('Upload error:', error);
      }
    }

    function handleInit(initData) {
      document.getElementById('progressInfo').textContent = '上传初始化完成，开始上传...';
      updateStats(
        initData.totalFiles,
        initData.completedFiles,
        initData.uploaded,
        `${initData.progress}%`
      );
    }

    function handleProgressUpdate(progressData) {
      document.getElementById('progressFill').style.width = progressData.progress + '%';
      document.getElementById('progressFill').textContent = progressData.progress + '%';
      document.getElementById('progressInfo').textContent =
        `已上传: ${formatFileSize(progressData.uploaded)} / ${formatFileSize(progressData.total)}`;

      updateStats(
        progressData.totalFiles,
        progressData.completedFiles,
        progressData.uploaded,
        `${progressData.progress}%`
      );

      // 显示详细进度
      const detailedProgress = document.getElementById('detailedProgress');
      detailedProgress.innerHTML = `
                <div style="font-size: 12px; color: #666;">
                    总文件: ${progressData.totalFiles}, 
                    已完成: ${progressData.completedFiles}, 
                    状态: ${progressData.status}
                </div>
            `;

      if (progressData.files && progressData.files.length > 0) {
        uploadedFiles = progressData.files;
        displayUploadedFiles(uploadedFiles, progressData.status);
      }
    }

    function handleStatusUpdate(statusData) {
      document.getElementById('progressInfo').textContent = statusData.message || '状态更新';
      if (statusData.progress !== undefined) {
        document.getElementById('progressFill').style.width = statusData.progress + '%';
        document.getElementById('progressFill').textContent = statusData.progress + '%';
      }
    }

    function handleComplete(progressData) {
      document.getElementById('progressInfo').textContent = progressData.message || '上传完成！';
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('progressFill').textContent = '100%';

      showStatus(progressData.message || '上传完成！', 'success');

      uploadedFiles = progressData.files;
      displayUploadedFiles(uploadedFiles, progressData.status);

      updateStats(
        progressData.totalFiles,
        progressData.completedFiles,
        progressData.uploaded,
        '100%'
      );
    }

    function handleError(progressData) {
      document.getElementById('progressInfo').textContent = `错误: ${progressData.error}`;
      showStatus(`上传错误: ${progressData.error}`, 'error');

      if (progressData.files) {
        uploadedFiles = progressData.files;
        displayUploadedFiles(uploadedFiles, progressData.status);
      }
    }

    function handleEnd(data) {
      if (uploadSSE) {
        uploadSSE.close();
        uploadSSE = null;
        document.getElementById('sseStatus').className = 'sse-status closed';
        document.getElementById('sseStatus').textContent = 'SSE状态: 上传已断开';
      }
    }

    function displayUploadedFiles(files, status = 'uploading') {
      const container = document.getElementById('uploadedFilesList');
      container.innerHTML = '';

      files.forEach((file, index) => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';

        let statusText = '上传中';
        if (file.moved) {
          statusText = '已移动';
        } else if (file.uploadComplete) {
          statusText = '已上传';
        }

        fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">${file.originalname}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                        <div class="file-status">${statusText}</div>
                    </div>
                    <div class="file-actions">
                        ${file.path ?
            `<button class="action-btn download" onclick="downloadFile('${file.filename}')">下载</button>` :
            '<button class="action-btn" disabled>下载</button>'
          }
                        <button class="action-btn delete" onclick="deleteFile('${file.filename}', this)">删除</button>
                    </div>
                `;
        container.appendChild(fileItem);
      });
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;

      // 5秒后自动隐藏
      setTimeout(() => {
        statusDiv.innerHTML = '';
      }, 5000);
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function updateStats(totalFiles, completedFiles, totalSize, progress) {
      document.getElementById('totalFiles').textContent = totalFiles;
      document.getElementById('completedFiles').textContent = completedFiles;
      document.getElementById('totalSize').textContent = formatFileSize(totalSize);
      document.getElementById('currentProgress').textContent = progress;
    }

    async function downloadFile(filename) {
      window.open(`/uploads/${filename}`, '_blank');
    }

    async function deleteFile(filename, button) {
      if (confirm('确定要删除这个文件吗？')) {
        try {
          const response = await fetch(`/api/files/${filename}`, {
            method: 'DELETE'
          });

          const result = await response.json();

          if (result.success) {
            button.parentElement.parentElement.remove();
            showStatus('文件已删除', 'info');

            // 重新加载文件列表
            loadFileList();
          } else {
            showStatus(`删除失败: ${result.error}`, 'error');
          }
        } catch (error) {
          showStatus(`删除错误: ${error.message}`, 'error');
        }
      }
    }

    async function loadFileList() {
      try {
        const response = await fetch('/api/files');
        const result = await response.json();
        if (result.success) {
          uploadedFiles = result.files;
          displayUploadedFiles(uploadedFiles, 'completed');
          updateStats(result.count, result.count,
            result.files.reduce((sum, file) => sum + file.size, 0), '100%');
        }
      } catch (error) {
        console.error('Failed to load files:', error);
      }
    }

    // 页面加载时获取文件列表
    window.addEventListener('load', loadFileList);
  </script>
</body>

</html>
